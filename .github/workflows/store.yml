name: Store

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 */6 * * *" # pick up new pack releases
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test scripts/build-index.test.mjs
      - name: Build catalogue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-index.mjs --out site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
